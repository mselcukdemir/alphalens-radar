name: AlphaLens Sabah Radari

on:
  schedule:
    # 📌 GitHub UTC saat dilimini kullanır. TSİ 09:30 için buraya 06:30 yazıyoruz.
    - cron: '30 6 * * *'
  workflow_dispatch: # İstediğiniz an elinizle de tetikleyebilmeniz için buton açar

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install pandas tabulate requests

      - name: AlphaLens Motorunu Çalıştır
        run: |
          python alphalens.py
